# docker-compose.yml for Flame Training (Dev Mode)
#
# Usage:
#   docker-compose -f /home/a84400789/flame/docker/docker-compose.yml up -d          # Start container in background
#   docker-compose -f /home/a84400789/flame/docker/docker-compose.yml exec gdn-pretrain bash # Enter the running container
#   docker exec -it gdn-pretrain bash # Alternative way to enter the running container 
#   docker-compose -f /home/a84400789/flame/docker/docker-compose.yml down            # Stop and remove container
#   docker-compose logs -f gdn-pretrain   # View container logs
#
# The container runs as a daemon with an interactive shell.
# You can enter and exit freely without stopping the container.

services:
  gdn-pretrain:
    image: daal/flame:v0
    container_name: gdn-pretrain

    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # IPC and ulimits (required for distributed training)
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864

    # Network configuration (required for multi-node training)
    network_mode: host

    # Environment variables
    environment:
      - NGPU=8
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - NCCL_DEBUG=WARN
      - HF_HOME=/home/a84400789/.cache/huggingface
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_PROJECT=flame-training
      - MASTER_ADDR=${MASTER_ADDR:-localhost}
      - MASTER_PORT=${MASTER_PORT:-29500}

    # Volume mounts (host home dir mapped into container)
    volumes:
      - /home/a84400789:/home/a84400789

    # Working directory
    working_dir: /home/a84400789

    # Keep container running as a daemon
    stdin_open: true
    tty: true
    # Start an interactive shell by default and install the evaluation harness (flame has been installed in the entrypoint of the image)
    command: /bin/bash -c "pip install -e /home/a84400789/lm-evaluation-harness && exec bash"

    # Restart policy
    restart: unless-stopped